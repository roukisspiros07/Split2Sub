name: split2sub

services:
  db:
    image: postgres:17-alpine
    container_name: group_subs_db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: group_subs_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: